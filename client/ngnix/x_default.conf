server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name mesh-hub.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

map $http_origin $cors_site_v {
    ~. 'Origin';
}
map $http_origin $cors_site_origin {
    '~^https?://(localhost)' $http_origin;
}
map '$request_method#$cors_site_origin#$http_access_control_request_method' $cors_site_options {
    '~^OPTIONS#.+#(?:GET|HEAD|POST|OPTIONS)$' okay;
    '~^OPTIONS#.' nope;
}
map '$request_method#$cors_site_origin' $cors_site_acao {
    '~^(?:GET|HEAD|POST)#.' $cors_site_origin;
}
map $cors_site_acao $cors_site_acac {
    ~. 'true';
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    client_max_body_size 500M;

    server_name mesh-hub.ru;

    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private-key.key;

    set $backend_server host.docker.internal;
    set $cors_allow_methods "GET, POST, HEAD, OPTIONS";
    set $cors_allow_headers "Accept, Accept-Language, Authorization, Cache-Control, Content-Language, Content-Type, Cookie, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Mx-ReqToken, X-Requested-With, x-access-token, Resource-Version, Web-Client-Version, x-request-id";
    set $cors_max_age 86400;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        if ($cors_site_options = nope) {
            add_header Vary $cors_site_v;
            return 204 '';
        }

        if ($cors_site_options = okay) {
            add_header Access-Control-Allow-Origin $cors_site_origin;
            add_header Access-Control-Allow-Credentials $cors_site_acac;
            add_header Vary $cors_site_v;
            add_header Access-Control-Allow-Methods $cors_allow_methods;
            add_header Access-Control-Allow-Headers $cors_allow_headers;
            add_header Access-Control-Max-Age $cors_max_age;
            return 204 '';
        }

        add_header Access-Control-Allow-Origin $cors_site_acao;
        add_header Access-Control-Allow-Credentials $cors_site_acac;
        add_header Vary $cors_site_v;

        add_header  X-Frame-Options "SAMEORIGIN" always;

        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    location /api/ {
        if ($cors_site_options = nope) {
            add_header Vary $cors_site_v;
            return 204 '';
        }

        if ($cors_site_options = okay) {
            add_header Access-Control-Allow-Origin $cors_site_origin;
            add_header Access-Control-Allow-Credentials $cors_site_acac;
            add_header Vary $cors_site_v;
            add_header Access-Control-Allow-Methods $cors_allow_methods;
            add_header Access-Control-Allow-Headers $cors_allow_headers;
            add_header Access-Control-Max-Age $cors_max_age;
            return 204 '';
        }

        add_header Access-Control-Allow-Origin $cors_site_acao;
        add_header Access-Control-Allow-Credentials $cors_site_acac;
        add_header Vary $cors_site_v;

        add_header  X-Frame-Options "SAMEORIGIN" always;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_pass http://$backend_server:8080;
    }

    location /swagger/ {
        if ($cors_site_options = nope) {
            add_header Vary $cors_site_v;
            return 204 '';
        }

        if ($cors_site_options = okay) {
            add_header Access-Control-Allow-Origin $cors_site_origin;
            add_header Access-Control-Allow-Credentials $cors_site_acac;
            add_header Vary $cors_site_v;
            add_header Access-Control-Allow-Methods $cors_allow_methods;
            add_header Access-Control-Allow-Headers $cors_allow_headers;
            add_header Access-Control-Max-Age $cors_max_age;
            return 204 '';
        }

        add_header Access-Control-Allow-Origin $cors_site_acao;
        add_header Access-Control-Allow-Credentials $cors_site_acac;
        add_header Vary $cors_site_v;

        add_header  X-Frame-Options "SAMEORIGIN" always;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_pass http://$backend_server:8080;
    }
}
