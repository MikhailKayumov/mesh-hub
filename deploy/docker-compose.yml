version: "3.9"

name: mesh-hub-prod

networks:
  mesh-hub-net-prod-server: {}
  mesh-hub-net-prod-client: {}

services:
  mesh-hub-prod-db:
    image: postgres:14-alpine
    container_name: mesh-hub-prod-db
    environment:
      - POSTGRES_DB=meshhub
      - POSTGRES_USER=SuperMesh
      - POSTGRES_PASSWORD=407ef57e67e04690636550a34ed05fb1e135b7ff6e4d941be236eadb6b359b6981954f8cbcdb927086c3bfa22061ebf8017db9ad3419debc03f2abb67821f1f5
    networks:
      - mesh-hub-net-prod-server
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "8432:5432"
    restart: unless-stopped

  mesh-hub-prod-server:
    container_name: mesh-hub-prod-server
#    image: mesh-hub-prod-server:v1
    build:
      context: ..
      dockerfile: ./deploy/server.Dockerfile
    depends_on:
      - mesh-hub-prod-db
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - mesh-hub-net-prod-server
      - mesh-hub-net-prod-client
    volumes:
      - ./data/files:/app/files
      - ./data/.log:/app/.log
    env_file:
      - ./.env.server

  mesh-hub-prod-client:
    container_name: mesh-hub-prod-client
#    image: mesh-hub-prod-client:v1
    build:
      context: ..
      dockerfile: ./deploy/client.Dockerfile
    depends_on:
      - mesh-hub-prod-server
    ports:
      - '80:80'
#      - '443:443'
    restart: unless-stopped
    networks:
      - mesh-hub-net-prod-client

volumes:
  db:
    name: mesh-hub-db-volume-prod
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./data/db"
