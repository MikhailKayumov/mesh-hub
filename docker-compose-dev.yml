networks:
  mesh-hub-dev: {}

name: mesh-hub

services:
  db:
    image: postgres:alpine
    env_file: ./server/.env
    networks:
      - mesh-hub-dev
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "8432:5432"
    restart: unless-stopped

  fs:
   image: quay.io/minio/minio
   container_name: fs
   volumes:
     - ./data/s3:/data
   command: server --console-address ":8881" /data/
   restart: unless-stopped
   ports:
     - "8881:9000"
     - "8882:8881"
   environment:
     - MINIO_ROOT_USER=ROOTNAME
     - MINIO_ROOT_PASSWORD=ROOTPASSWORD
   networks:
     - mesh-hub-dev
   healthcheck:
     test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
     interval: 30s
     timeout: 20s
     retries: 3
