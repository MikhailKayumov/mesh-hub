networks:
  mesh-hub-dev: {}

name: mesh-hub

services:
  db:
    image: postgres:alpine
    env_file: ./server/.env
    networks:
      - mesh-hub-dev
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "8432:5432"
    restart: unless-stopped

