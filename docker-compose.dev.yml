networks:
  mesh-hub-dev-net: {}

name: mesh-hub

services:
  db:
    image: postgres:18.0
    env_file:
      ./server/.env
    networks:
      - mesh-hub-dev-net
    volumes:
      - ./data/db:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 30s
      timeout: 10s
      retries: 3

