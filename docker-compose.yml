name: mh

networks:
  net-db: {}
  net-api: {}

services:
  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=meshhub
      - POSTGRES_USER=SuperMesh
      - POSTGRES_PASSWORD=407ef57e67e04690636550a34ed05fb1e135b7ff6e4d941be236eadb6b359b6981954f8cbcdb927086c3bfa22061ebf8017db9ad3419debc03f2abb67821f1f5
    networks:
      - net-db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - net-db
      - net-api
    volumes:
      - ./data/files:/app/files
      - ./data/.log:/app/.log
    env_file:
      - ./server/.env.deploy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - '80:80'
      # - '443:443'
    restart: unless-stopped
    networks:
      - net-api
