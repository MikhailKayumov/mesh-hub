name: mh

networks:
  net-db: {}
  net-api: {}

services:
  db:
    image: postgres:alpine
    networks:
      - net-db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    env_file:
      - ./server/.env.deploy

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - '8088:8080'
    restart: unless-stopped
    networks:
      - net-db
      - net-api
    volumes:
      - ./data/files:/app/files
      - ./data/.log:/app/.log
    env_file:
      - ./server/.env.deploy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - '80:80'
      # - '443:443'
    restart: unless-stopped
    networks:
      - net-api
