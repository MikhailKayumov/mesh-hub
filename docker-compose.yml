version: '3.8'

networks:
  mesh-hub-net:
    driver: bridge

services:
  postgres:
    image: postgres:14.6
    container_name: postgres
    env_file: ./server/.env
    networks:
      - mesh-hub-net
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "8888:5432"
    restart: unless-stopped

volumes:
  postgres:
    driver: local
