version: '3.8'

networks:
  mesh-hub-net:
    driver: bridge

name: mesh-hub

services:
  postgres:
    image: postgres:14-alpine
    container_name: db
    env_file: ./server/.env
    networks:
      - mesh-hub-net
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "8888:5432"
    restart: unless-stopped

  s3:
    image: quay.io/minio/minio
    container_name: s3
    volumes:
      - s3:/data
    command: server --console-address ":8881" /data/
    restart: unless-stopped
    ports:
      - "8881:9000"
      - "8882:8881"
    environment:
      - MINIO_ROOT_USER=ROOTNAME
      - MINIO_ROOT_PASSWORD=ROOTPASSWORD
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_PROMETHEUS_URL=http://prometheus:9090
      - MINIO_PROMETHEUS_JOB_ID=PBFA97CFB590B2093
    networks:
      - mesh-hub-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  db:
    name: mesh-hub-db-volume
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./data/db"
  s3:
    name: mesh-hub-s3-volume
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./data/s3"
